# coverage_nenner.yaml — DoD-6 SSOT: der NENNER aller bekannten Blindstellen-/Signal-Klassen.
# Spec: docs/internal/an internal spec (Nenner-Schema, 5 Kategorien).
# Gepruft von scripts/coverage_check.mjs (vom Gate gerufen, blockierend):
#   Richtung →  jede kategorie:signal hat existierenden forcing_test
#   Richtung ←  binär-sicherer Code-Vokabular-Scan: jedes emittierbare Signal ∉ Nenner ⇒ ROT
#   reserviert  0 Emissions-Stellen außerhalb des REASON_CODES-Katalogs
#
# FORMAT (strikt, vom Mini-Parser in coverage_check.mjs erzwungen):
#   Einträge beginnen mit `- signal:`; danach flache `key: value`-Zeilen (4 Spaces Einzug).
#   Erlaubte kategorie: signal | grenze | werkzeug | reserviert | defensiv
#   Pflichtfelder: signal, achse, quelle, kategorie
#     kategorie signal     → forcing_test (Datei muss existieren UND das
#                            forcing_token ENTHALTEN; forcing_token optional,
#                            Default = signal-String — Umbenennungs-/
#                            Entleerungs-Drift wird so rot)
#     kategorie grenze     → doku_ref
#     kategorie werkzeug   → grund (wird PFLICHTIG bei Produktiv-Verdrahtung)
#     kategorie reserviert → katalog (Deklarations-Ort)
#     kategorie defensiv   → code_witness + grund (kein Fake-Forcing-Test)
#   KATEGORIE-WANDEL-WACHE: für werkzeug/defensiv/reserviert vergleicht der Check
#   die Scan-Fundstellen DATEI-genau gegen die in `quelle` genannten src-Dateien —
#   Emission an neuem Ort ⇒ ROT („Kategorie-Drift … Nenner pflegen"). `quelle`
#   daher bei Mehrfach-Stellen als Liste aller Dateien/Anker pflegen.
#
# SCAN-GRENZE (ehrlich dokumentiert): der Richtung-←-Scan deckt LITERAL-Emissionen
# (Projekt-Konvention: Signale werden als UPPER_SNAKE-Literal über die Signal-Kanäle
# warnings/reasons/markers-push, error-Code-Zeile, Frozen-Katalog, Schema-Enum
# emittiert). Dynamisch komponierte Codes (z.B. sanitize_loss.reason
# `ATTR_STRIPPED:${attr}`), Daten-Payloads innerhalb bereits genannter Signale
# (sanitize_loss.reason-Werte TAG_STRIPPED/EXTERNAL_USE_NOT_RESOLVED, Diff-Typen
# NEU/ENTFERNT/…) und Alias-Indirektion deckt die ZWEITE Verteidigungslinie:
# Nenner-Pflege-Pflicht bei jedem neuen REGISTER-Blindstellen-Eintrag (Intent §IST-NICHT).
#
# Rekonstruiert MECHANISCH 2026-06-10 (binär-sichere Scans, D-029-fest);
# Finishing-Runde R1–R5 (Codex-Schärfungen) 2026-06-10:
# 53 Produktiv (50 signal + 3 defensiv) · 20 werkzeug · 18 grenze · 3 reserviert = 94.
# (+3 signal 2026-06-11: §6 RELAIS error{code,hint} — NO_BASELINE/ANALYSIS_NOT_FOUND/ARRANGE_FAILED)
# (§H10 2026-06-11: +1 signal CONSTRAINT_UNPARSEABLE; SEMANTIC_SUSPICIOUS reserviert→signal)
# (§H10 P1 Patch-Runde 2026-06-11: +1 signal REFERENCE_HIDDEN — Symmetrie zu SUBJECT_HIDDEN)
# pw = src/adapters/renderer/playwright.js · pl = src/pipeline.js

