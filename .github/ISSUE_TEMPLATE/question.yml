name: Question
description: Usage question, integration help, or "is this the right tool for X?"
title: "[question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome. For open-ended discussion, consider
        [GitHub Discussions](https://github.com/c64dos-png/vector-mirror/discussions) instead.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: MCP client, config snippet, or an SVG you are working with — anything that helps answer precisely.
    validations:
      required: false
